# Маппинг датасетов Roboflow Universe и других YOLO-наборов по ключевым словам имени класса.
# Правила проверяются сверху вниз, первое совпадение (подстрока, без регистра) побеждает.
# Пример: "PET bottle" → pet_bottle, "Plastic bag" → film, "Battery" → hazardous.
- [pet, pet_bottle]
- [bottle-plastic, pet_bottle]
- [plastic bottle, pet_bottle]
- [plastic_bottle, pet_bottle]
- [bag, film]
- [film, film]
- [wrapper, film]
- [hdpe, hard_plastic]
- [polypropylene, hard_plastic]
- [plastic, hard_plastic]
- [cardboard, cardboard]
- [carton, cardboard]
- [box, cardboard]
- [paper, paper]
- [newspaper, paper]
- [tetra, tetra_pak]
- [juice box, tetra_pak]
- [milk, tetra_pak]
- [glass, glass]
- [jar, glass]
- [alumin, aluminum_can]
- [can, tin_can]
- [tin, tin_can]
- [metal, tin_can]
- [food, organic]
- [organic, organic]
- [bio, organic]
- [fruit, organic]
- [vegetable, organic]
- [cloth, textile]
- [textile, textile]
- [shoe, textile]
- [batter, hazardous]
- [lamp, hazardous]
- [bulb, hazardous]
- [electron, hazardous]
- [e-waste, hazardous]
- [trash, other]
- [waste, other]
- [other, other]
