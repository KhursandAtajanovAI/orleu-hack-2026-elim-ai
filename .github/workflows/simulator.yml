name: Симулятор · данные и реальное время

# Поток H (ТЗ 14). Всё через публичное API от имени демо-аккаунтов — нужен только anon key.
#   Run workflow → command:
#     all     — очистить прошлую симуляцию, сиды Астаны, история за N дней (одна команда → полные тестовые данные)
#     history — дописать историю (по расписанию — каждую ночь за вчерашний день, чтобы демо было «свежим»)
#     live    — 5 машин в реальном времени (пульт: админка → «Симулятор»), до 6 часов
#     purge / check
# Нужны переменные репозитория NEXT_PUBLIC_SUPABASE_URL и NEXT_PUBLIC_SUPABASE_ANON_KEY
# (те же, что для GitHub Pages) и секреты функции DEMO_MODE=true, DEMO_PASSWORD в Supabase.
on:
  workflow_dispatch:
    inputs:
      command:
        description: 'all · history · live · purge · check'
        default: all
        type: choice
        options: [all, history, live, purge, check]
      days:
        description: 'Дней истории (all / history)'
        default: '14'
      speed:
        description: 'Скорость live: 1 · 10 · 60'
        default: '10'
      minutes:
        description: 'Сколько минут вести машины (live, ≤ 350)'
        default: '120'
  schedule:
    - cron: '30 19 * * *'   # 00:30 по Астане — история за прошедший день

concurrency:
  group: simulator-${{ inputs.command || 'nightly' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Проверка настроек
        id: cfg
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            msg="Нет переменных NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions → Variables)"
            if [ "${{ github.event_name }}" = "schedule" ]; then echo "::notice::$msg — ночной запуск пропущен"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "::error::$msg"; exit 1
          fi
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.skip != '1'
        with:
          node-version: 22
      - name: Кэш треков OSRM
        if: steps.cfg.outputs.skip != '1'
        uses: actions/cache@v4
        with:
          path: simulator/data/routes-cache.json
          key: osrm-${{ hashFiles('simulator/data/astana.ts') }}-${{ github.run_id }}
          restore-keys: osrm-${{ hashFiles('simulator/data/astana.ts') }}-
      - name: Симулятор
        if: steps.cfg.outputs.skip != '1'
        working-directory: simulator
        run: |
          CMD="${{ inputs.command || 'history' }}"
          DAYS="${{ inputs.days || '1' }}"
          case "$CMD" in
            all|history) node --experimental-strip-types --no-warnings src/cli.ts "$CMD" --days "$DAYS" ;;
            live) node --experimental-strip-types --no-warnings src/cli.ts live --speed "${{ inputs.speed || '10' }}" --minutes "${{ inputs.minutes || '120' }}" ;;
            *) node --experimental-strip-types --no-warnings src/cli.ts "$CMD" ;;
          esac
      - name: Сводка
        if: always() && steps.cfg.outputs.skip != '1' && (inputs.command == 'all' || inputs.command == 'history' || github.event_name == 'schedule')
        working-directory: simulator
        run: node --experimental-strip-types --no-warnings src/cli.ts check | tee -a "$GITHUB_STEP_SUMMARY"
