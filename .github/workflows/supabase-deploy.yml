name: Supabase · деплой БД и API

# Автодеплой из main (ТЗ 1): миграции → база, Edge Function api → Supabase.
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   — id проекта (xxxx из https://xxxx.supabase.co)
#   SUPABASE_DB_PASSWORD   — пароль базы проекта
# и (один раз) секреты функции: supabase secrets set AI_SERVICE_URL=... AI_SERVICE_KEY=... DEMO_MODE=true DEMO_PASSWORD=...
on:
  push:
    branches: [main]
    paths: ['db/supabase/**', '.github/workflows/supabase-deploy.yml']
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Секреты заданы?
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::notice::Секреты Supabase не заданы — деплой пропущен (см. docs/DEPLOY.md)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.skip != 'true'
        with:
          version: latest
      - name: Миграции
        if: steps.check.outputs.skip != 'true'
        working-directory: db
        run: |
          supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
          supabase db push -p "$SUPABASE_DB_PASSWORD"
      - name: Edge Function api
        if: steps.check.outputs.skip != 'true'
        working-directory: db
        run: supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt
